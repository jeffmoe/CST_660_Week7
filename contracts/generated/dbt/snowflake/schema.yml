      enforced: true
    materialized: incremental
    meta:
      owner: Lead Analytics Engineer
      contract_version: 1
      classification: C2
      retention_rule: R-15
      consumers:
      - CON-ML
      governance:
      - id: GR-FEA-01
        rule: schema
        on_fail: block_publish
      - id: GR-FEA-02
        rule: not_null
        on_fail: block_publish
      - id: GR-FEA-03
        rule: unique
        on_fail: block_publish
      - id: GR-FEA-04
        rule: freshness
        on_fail: serve_stale_and_alert
        escalate_to: block_publish
      - id: GR-FEA-05
        rule: consent_scope
        on_fail: quarantine_rows
        escalate_to: block_publish
      incremental_lookback_days: 3
  columns:
  - name: subscriber_id
