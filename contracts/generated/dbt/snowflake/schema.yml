- name: rag_transcript_chunks
  description: Redacted, chunked support transcripts for the retention-support assistant's retrieval corpus.
    Only chunks that pass PII scanning and consent scope are published; the vector index is built from
    this table and nothing else.
  config:
    contract:
      enforced: true
    materialized: incremental
    meta:
      owner: ML Engineering lead
      contract_version: 1
      classification: C3
      retention_rule: R-11
      consumers:
      - CON-RAG
      governance:
      - id: GR-RAG-01
        rule: schema
        on_fail: block_publish
      - id: GR-RAG-02
        rule: not_null
        on_fail: quarantine_rows
      - id: GR-RAG-03
        rule: pii_scan
        on_fail: quarantine_rows
      - id: GR-RAG-04
        rule: freshness
        on_fail: warn
        escalate_to: serve_stale_and_alert
      - id: GR-RAG-05
        rule: consent_scope
        on_fail: quarantine_rows
        escalate_to: block_publish
      incremental_lookback_days: 3
  columns:
  - name: chunk_id
    data_type: varchar
    description: Deterministic hash of ticket_id, chunk_index and redaction_version.
    meta:
      classification: C1
      pii: false
    constraints:
    - type: not_null
    data_tests:
    - unique
  - name: ticket_id
    data_type: varchar
    description: Helpdesk ticket key.
    meta:
      classification: C2
      pii: false
    constraints:
    - type: not_null
  - name: subscriber_id
    data_type: varchar
    description: Surrogate subscriber key (for consent and deletion; never shown to the model).
    meta:
      classification: C2
      pii: false
    constraints:
    - type: not_null
  - name: chunk_index
    data_type: number(38,0)
    description: Position of the chunk within the ticket.
    meta:
      classification: C1
      pii: false
    constraints:
    - type: not_null
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0.0
  - name: chunk_text_redacted
    data_type: varchar
    description: Redacted transcript text (residual-risk Restricted data).
    meta:
      classification: C3
      pii: true
      pii_element: PII-TRN-02
    constraints:
    - type: not_null
  - name: token_count
    data_type: number(38,0)
    description: Tokens in the chunk; capped by A-TRN-04 chunk size.
    meta:
      classification: C1
      pii: false
    constraints:
    - type: not_null
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 1.0
        max_value: 512.0
  - name: topic_tags
    data_type: array
    description: Support topic labels (billing, shipping, cancellation, product).
    meta:
      classification: C1
      pii: false
  - name: ticket_closed_at
    data_type: timestamp_tz
    description: Retention clock start for R-11.
    meta:
      classification: C1
      pii: false
    constraints:
    - type: not_null
  - name: redaction_version
    data_type: varchar
    description: Version of the redaction pipeline that produced the text.
    meta:
      classification: C1
      pii: false
    constraints:
    - type: not_null
  - name: _loaded_at
    data_type: timestamp_tz
    description: Time the chunk was published.
    meta:
      classification: C1
      pii: false
    constraints:
    - type: not_null
