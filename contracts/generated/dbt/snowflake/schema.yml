# Generated by scripts/build_contracts.py for the snowflake candidate (ADR-001). Do not edit.
version: 2
sources:
- name: raw
  tables:
  - name: subscription_events
    description: Append-only landing table for clickstream, subscription lifecycle, billing and messaging
      events. Micro-batch landing every 15 minutes (ADR-003).
    loaded_at_field: ingested_at
    freshness:
      warn_after:
        count: 30
        period: minute
      error_after:
        count: 60
        period: minute
    meta:
      owner: Data Engineering lead
      contract_version: 1
      classification: C3
      retention_rule: R-06
      consumers: []
      governance:
      - id: GR-EVT-01
        rule: schema
        on_fail: block_publish
      - id: GR-EVT-02
        rule: not_null
        on_fail: quarantine_rows
      - id: GR-EVT-03
        rule: unique
        on_fail: quarantine_rows
      - id: GR-EVT-04
        rule: pii_scan
        on_fail: quarantine_rows
      - id: GR-EVT-05
        rule: freshness
        on_fail: warn
        escalate_to: block_publish
    columns:
    - name: event_id
      data_type: varchar
      description: Producer-generated UUID; idempotency key for merges (ADR-003).
      meta:
        classification: C1
        pii: false
      data_tests:
      - not_null
      - unique
    - name: event_type
      data_type: varchar
      description: Event name from the controlled vocabulary.
      meta:
        classification: C1
        pii: false
      data_tests:
      - not_null
      - accepted_values:
          values:
          - page_view
          - product_view
          - add_to_cart
          - checkout_completed
          - subscription_created
          - subscription_paused
          - subscription_skipped
          - subscription_resumed
          - subscription_cancelled
          - cancel_page_view
          - payment_succeeded
          - payment_failed
          - email_sent
          - email_opened
          - email_clicked
          - sms_sent
          - sms_clicked
          - unsubscribed
    - name: source
      data_type: varchar
      description: Producing system.
      meta:
        classification: C1
        pii: false
      data_tests:
      - not_null
      - accepted_values:
          values:
          - web
          - app
          - billing
          - subscription_platform
          - esp
          - sms
    - name: event_time
      data_type: timestamp_tz
      description: When the event happened (UTC), set by the producer.
      meta:
        classification: C1
        pii: false
      data_tests:
      - not_null
    - name: ingested_at
      data_type: timestamp_tz
      description: When the event landed in the warehouse (UTC); late = ingested_at - event_time.
      meta:
        classification: C1
        pii: false
      data_tests:
      - not_null
    - name: subscriber_id
      data_type: varchar
      description: Surrogate subscriber key; null for anonymous web/app traffic.
      meta:
        classification: C2
        pii: false
    - name: anonymous_id
      data_type: varchar
      description: Cookie/device identifier (hashed in staging).
      meta:
        classification: C3
        pii: true
        pii_element: PII-SUB-06
    - name: ip_address
      data_type: varchar
      description: Client IP; dropped in staging (R-06 end action).
      meta:
        classification: C3
        pii: true
        pii_element: PII-SUB-06
    - name: user_agent
      data_type: varchar
      description: Client user agent.
      meta:
        classification: C3
        pii: true
        pii_element: PII-SUB-06
    - name: properties
      data_type: variant
      description: Event-specific payload; free text is DLP-scanned before landing (ABAC-07).
      meta:
        classification: C2
        pii: false
models:
- name: churn_features_v1
