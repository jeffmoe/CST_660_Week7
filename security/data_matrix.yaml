    classification: C2
    system_of_record: Billing platform / processor
    warehouse_layer: staging, marts, features
    purposes: [P1, P5]
    retention: R-05
    access_policies: [ABAC-02, ABAC-06]
    regimes: [CCPA, US-TAX]
