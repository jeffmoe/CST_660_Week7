    regimes: [PCI-DSS, CCPA]

# --------------------------------------------------------------------------
# RBAC: baseline grant per classification level. ABAC policies narrow it.
# full = unmasked; masked = C3 columns masked; pseudo = surrogate IDs only;
# agg = aggregates with k >= 10; synthetic = synthetic data only; none.
rbac_roles:
  - role: privacy_officer
    description: Handles privacy requests, consent and deletion audits
    C1: full
    C2: full
    C3: full (logged, purpose-bound)
    C4: none
  - role: platform_admin_breakglass
    description: Emergency platform access, time-boxed and approved
    C1: full
    C2: full
    C3: masked
    C4: none
  - role: data_engineer
    description: Ingestion, redaction pipeline, platform operations
    C1: full
    C2: full
    C3: masked (unmasked in redaction staging only)
    C4: none
  - role: analytics_engineer
    description: dbt models, marts, feature tables
    C1: full
    C2: full
    C3: masked
    C4: none
  - role: ml_engineer
    description: Churn model training and evaluation
    C1: full
    C2: pseudo
    C3: none
    C4: none
  - role: retention_analyst
    description: Retention dashboards and campaign analysis
    C1: full
    C2: pseudo
    C3: none
    C4: none
  - role: retention_agent
    description: Retention staff using the assistant and CRM
    C1: agg
    C2: own assigned subscribers only
    C3: own assigned subscribers only (via CRM / assistant)
    C4: none
  - role: finance_analyst
    description: Revenue and billing reporting
    C1: full
    C2: full (billing only)
    C3: none
    C4: none
  - role: svc_retention_assistant
    description: Assistant service identity (ADR-004 Zone 1)
    C1: full
    C2: none
    C3: redacted transcripts and embeddings only, read-only
    C4: none
  - role: svc_code_agent
    description: PR-authoring agent identity (ADR-004 Zone 2/3)
    C1: synthetic
    C2: synthetic
    C3: none
    C4: none

abac_policies:
  - id: ABAC-01
    name: Default masking of Restricted columns
    rule: Columns tagged pii=true / C3 return masked values unless role is in the unmasked list for that column AND the session declares a matching purpose.
    attributes: [column.classification, user.role, session.purpose]
    enforced_in: Warehouse masking policies (ADR-001)
  - id: ABAC-02
    name: Purpose and objection filter
    rule: Rows for subscribers with consent.analytics_objection = true are excluded from feature, model and targeting views (row access policy).
    attributes: [row.subscriber_id, consent.analytics_objection, view.purpose]
    enforced_in: Warehouse row access policies; nightly feature build (ADR-002)
  - id: ABAC-03
    name: Consumer-health-data gate
    rule: Health-tagged rows and columns (PII-SUB-04 health categories, PII-SUB-05) are visible only when consent.health_data = true AND view.purpose in {fulfillment, personalization}; never in churn features unless Legal approves at SEC-G8.
    attributes: [column.health_tag, consent.health_data, view.purpose]
    enforced_in: Warehouse row/column policies
  - id: ABAC-04
    name: Location-bound access to Restricted data
    rule: Sessions whose user.location or service region is outside A-REG-03 hosting region are denied C3 unless the location is on the SEC-G1/SEC-G2 approved list.
    attributes: [user.location, service.region, data.classification]
    enforced_in: Identity provider conditional access + warehouse network policies
  - id: ABAC-05
    name: Service identities never see production PII
    rule: Service identities in environment=prod are denied C2-C4 except svc_retention_assistant on redacted transcripts/embeddings; svc_code_agent sees synthetic schemas only (ADR-004).
    attributes: [identity.type, environment, data.classification]
    enforced_in: Warehouse roles; vector-store API keys
  - id: ABAC-06
    name: Deletion-pending exclusion
    rule: Rows with deletion_pending = true are hidden from every role except privacy_officer until hard-deleted (within 45 days of a verified request).
    attributes: [row.deletion_pending, user.role]
    enforced_in: Row access policy on every subscriber-keyed table
  - id: ABAC-07
    name: Prohibited-data and free-text DLP
    rule: Free text (transcripts, notes, prompts) is scanned for PAN, CVV, credentials and government IDs before landing; hits are dropped and raise a security incident.
    attributes: [content.dlp_match]
    enforced_in: Redaction pipeline (ADR-002 asset check)
  - id: ABAC-08
    name: Small-cell suppression on exports
    rule: Any export or share outside the warehouse suppresses groups with fewer than 10 subscribers (k >= 10) and drops direct identifiers; changes to quasi-identifier sets go to SEC-G4.
    attributes: [export.destination, group.size, column.quasi_identifier]
    enforced_in: Export jobs; reverse-ETL connectors

