    controls: [R-01, R-02, R-06, R-10, R-14]
    owner: Privacy / Legal
  - id: OB-02
    regime: CCPA
    obligation: Rights to know, delete and correct; respond within 45 days
    legal_ref: Cal. Civ. Code 1798.105, 1798.106, 1798.110, 1798.130
    controls: [ABAC-06, R-19, C-SEC-03]
    owner: Privacy officer
  - id: OB-03
    regime: CCPA
    obligation: Right to opt out of sale/sharing; honor Global Privacy Control
    legal_ref: Cal. Civ. Code 1798.120, 1798.135; 11 CCR 7025
