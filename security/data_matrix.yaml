# --------------------------------------------------------------------------
review_gates:
  - id: SEC-G1
    name: Cross-border transfer / new subprocessor
    risk: cross-border
    trigger: Any new vendor, subprocessor or region that stores or processes C2-C4 data outside the A-REG-03 hosting region, or any subprocessor location change.
    reviewers: [Privacy / Legal, Security lead]
    evidence_required: Subprocessor location list, DPA/service-provider terms, transfer mechanism and transfer impact assessment when GDPR is in scope.
    blocks: Contract signature and first data flow
    related: [A-REG-03, A-REG-04, OB-06, OB-12]
  - id: SEC-G2
    name: Remote access from outside the hosting region
    risk: cross-border
    trigger: Any employee, contractor or BPO accessing C3 data from outside the hosting region (A-REG-04).
    reviewers: [Security lead, Privacy / Legal, Customer Support lead]
    evidence_required: Access scope per role, ABAC-04 allow-list entry, contract terms, device controls.
    blocks: Granting access
    related: [A-REG-04, ABAC-04, OB-12]
  - id: SEC-G3
    name: Third-party model provider data flow (same gate as ADR-004 G0)
    risk: both
    trigger: Any transcript text, subscriber-derived text or embedding request sent to an external model or embedding provider.
    reviewers: [Privacy / Legal, Security lead, ML Engineering lead]
    evidence_required: Provider retention and training terms, processing location, redaction recall result (C-AI-02), DPIA when GDPR is in scope.
    blocks: Any external model call with Aurora data
    related: [A-GOV-01, P8, OB-06, OB-13]
  - id: SEC-G4
    name: Re-identification review of data leaving the controlled zone
    risk: re-identification
    trigger: Any export, share, reverse-ETL destination or published dataset built from C2/C3 data (including ML feature extracts leaving the warehouse and "de-identified" sets).
    reviewers: [Privacy officer, ML Engineering lead]
    evidence_required: Quasi-identifier list, k-anonymity / small-cell result (C-SEC-01), recipient contract terms.
    blocks: First run of the export
    related: [ABAC-08, C-SEC-01, E-SEC-01, E-SEC-02, E-SEC-03]
  - id: SEC-G5
    name: New linkage of quasi-identifiers
    risk: re-identification
    trigger: A model or mart that joins datasets in a way that adds quasi-identifiers to a pseudonymous table (e.g. ZIP + birth year + purchase history, device ID to transcripts).
    reviewers: [Privacy officer, Lead Analytics Engineer]
    evidence_required: Before/after quasi-identifier set and uniqueness estimate (C-SEC-01).
    blocks: Merge of the model (ADR-004 Zone 2 approval)
    related: [C-SEC-01, E-SEC-03]
  - id: SEC-G6
    name: Embedding and vector-store release
    risk: re-identification
    trigger: Creating, re-embedding or exposing the transcript vector index to a new consumer.
    reviewers: [Security lead, ML Engineering lead]
    evidence_required: Inversion test result (C-SEC-02); confirmation embeddings are classed C3 and follow R-12.
    blocks: Index exposure
    related: [C-SEC-02, E-SEC-04, R-12]
  - id: SEC-G7
    name: De-identification claim
    risk: re-identification
    trigger: Treating any dataset as de-identified / anonymous (outside privacy law scope).
    reviewers: [Privacy / Legal]
    evidence_required: Technical measures, public commitment and contractual no-re-identification terms; SEC-G4 result.
    blocks: Relabeling data to C1
    related: [R-07, SEC-G4]
  - id: SEC-G8
    name: Consumer-health-data determination
    risk: re-identification
    trigger: Before collecting quiz answers or using health-inferable purchase categories in features, targeting or the assistant.
    reviewers: [Privacy / Legal, Retention team lead]
    evidence_required: Legal determination on A-REG-02; consent flow (P7) design.
    blocks: Collection and any non-fulfillment use
    related: [A-REG-02, P7, ABAC-03, OB-07, OB-08]
